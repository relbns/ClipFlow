name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Build app bundle
      run: |
        chmod +x Scripts/build-app.sh
        ./Scripts/build-app.sh

    - name: Create DMG
      run: |
        # Install create-dmg
        brew install create-dmg

        # Create DMG
        create-dmg \
          --volname "ClipFlow" \
          --volicon "Sources/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512.png" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "ClipFlow.app" 175 190 \
          --hide-extension "ClipFlow.app" \
          --app-drop-link 425 190 \
          "Build/ClipFlow.dmg" \
          "Build/ClipFlow.app"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClipFlow-${{ github.ref_name }}
        path: Build/ClipFlow.dmg
        retention-days: 90

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: Build/ClipFlow.dmg
        draft: true
        body: |
          ## ClipFlow ${{ github.ref_name }}

          ### Installation
          1. Download `ClipFlow.dmg`
          2. Open the DMG
          3. Drag ClipFlow.app to Applications
          4. Open ClipFlow from Applications
          5. Grant Accessibility permission when prompted

          ### What's Changed
          - See commit history for details

          ### Requirements
          - macOS 14.0 (Sonoma) or later

          ---

          **Note:** This is an unsigned build. You may need to right-click → Open the first time.

          Built with ❤️ using [Claude Code](https://claude.ai/code)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
